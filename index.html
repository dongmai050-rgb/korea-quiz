const Q=[{"id": 0, "section": "A", "page": "35", "q": "표준 발음법 제2항에서 규정하는 표준어의 자음은 몇 개인가?", "t": "Điều 2 của quy tắc phát âm chuẩn quy định bao nhiêu phụ âm?", "opts": [["19개", "19 âm"], ["14개", "14 âm"], ["21개", "21 âm"], ["24개", "24 âm"]], "e": "Giáo trình nêu 19 phụ âm của tiếng Hàn chuẩn."}, {"id": 1, "section": "A", "page": "35–36", "q": "자음과 모음이 공통적으로 가지는 기능은?", "t": "Chức năng chung của phụ âm và nguyên âm là gì?", "opts": [["낱말의 뜻을 구별하는 기능", "Phân biệt nghĩa của từ"], ["항상 독립적으로 음절을 만드는 기능", "Luôn độc lập tạo âm tiết"], ["공기를 코로만 보내는 기능", "Chỉ đưa hơi qua mũi"], ["공기를 완전히 막는 기능", "Chặn hoàn toàn luồng hơi"]], "e": "Cả hai có chức năng âm vị, giúp phân biệt nghĩa từ (음소적 기능)."}, {"id": 2, "section": "A", "page": "36", "q": "음성적인 측면에서 자음과 모음을 구별하는 기준은?", "t": "Về mặt ngữ âm, tiêu chí phân biệt phụ âm và nguyên âm là gì?", "opts": [["공기 흐름의 장애 유무", "Có hay không có sự cản trở luồng hơi"], ["글자의 획수", "Số nét chữ"], ["음절의 개수", "Số âm tiết"], ["소리의 길이만", "Chỉ độ dài âm"]], "e": "Phụ âm có sự cản trở luồng khí, nguyên âm không có sự cản trở như vậy."}, {"id": 3, "section": "A", "page": "36", "q": "한국어에서 독립적으로 음절을 구성할 수 있는 것은?", "t": "Trong tiếng Hàn, thành phần nào có thể tự tạo âm tiết?", "opts": [["모음", "Nguyên âm"], ["모든 자음", "Mọi phụ âm"], ["파열음", "Âm tắc"], ["마찰음", "Âm xát"]], "e": "Nguyên âm có thể tạo âm tiết không cần phụ âm; phụ âm tiếng Hàn cần nguyên âm hỗ trợ."}, {"id": 4, "section": "A", "page": "36", "q": "한국어 음절에서 음절핵을 이루는 것은?", "t": "Thành phần nào tạo hạt nhân âm tiết tiếng Hàn?", "opts": [["모음", "Nguyên âm"], ["초성 자음", "Phụ âm đầu"], ["종성 자음", "Phụ âm cuối"], ["비음만", "Chỉ âm mũi"]], "e": "음절핵 là hạt nhân âm tiết, do nguyên âm đảm nhiệm."}, {"id": 5, "section": "A", "page": "36", "q": "한국어 음절의 기본 구조로 알맞은 것은?", "t": "Cấu trúc âm tiết cơ bản nào phù hợp?", "opts": [["（자음）-모음-（자음）", "(Phụ âm) – nguyên âm – (phụ âm)"], ["자음-자음-자음", "Phụ âm – phụ âm – phụ âm"], ["모음-자음-자음만", "Chỉ nguyên âm – phụ âm – phụ âm"], ["자음-자음만", "Chỉ phụ âm – phụ âm"]], "e": "Dấu ngoặc thể hiện phụ âm đầu và cuối không bắt buộc."}, {"id": 6, "section": "A", "page": "37", "q": "‘안’의 첫 글자 ㅇ에 대한 설명으로 옳은 것은?", "t": "Giải thích nào đúng về ㅇ đầu âm tiết trong 안?", "opts": [["자음이 비어 있음을 나타내는 부호이다.", "Ký hiệu cho vị trí phụ âm đầu trống"], ["항상 [ŋ]으로 발음한다.", "Luôn phát âm [ŋ]"], ["양순음이다.", "Là âm hai môi"], ["음절핵이다.", "Là hạt nhân âm tiết"]], "e": "ㅇ ở đầu âm tiết không biểu thị phụ âm [ŋ]; ở vị trí cuối âm tiết mới biểu thị âm mũi này."}, {"id": 7, "section": "A", "page": "37", "q": "영어 fish, photo, cough의 예로 알 수 있는 것은?", "t": "Ví dụ fish, photo, cough minh họa điều gì?", "opts": [["같은 [f] 소리가 여러 철자로 나타날 수 있다.", "Cùng âm [f] có thể có nhiều cách viết"], ["영어는 철자와 발음이 언제나 일대일 대응한다.", "Tiếng Anh luôn tương ứng 1–1 chữ và âm"], ["세 단어의 모음이 모두 같다.", "Ba từ có nguyên âm giống nhau"], ["[f]는 한국어의 표준 자음이다.", "[f] là phụ âm chuẩn tiếng Hàn"]], "e": "Các cách viết f, ph, gh minh họa sự không tương ứng 1–1 giữa chữ và âm."}, {"id": 8, "section": "A", "page": "37", "q": "한국어의 받침 ㅇ [ŋ]을 영어 철자로 옮길 때 일반적으로 쓰는 것은?", "t": "Khi ghi âm cuối ㅇ [ŋ] bằng chữ tiếng Anh, thường dùng gì?", "opts": [["ng", "ng"], ["nn", "nn"], ["ph", "ph"], ["gh", "gh"]], "e": "Sách lấy ng làm ví dụ cách biểu thị [ŋ]."}, {"id": 9, "section": "A", "page": "37–38", "q": "구강음과 비음을 구분하는 기준은?", "t": "Tiêu chí phân biệt âm miệng và âm mũi?", "opts": [["공기가 빠져나가는 통로", "Đường thoát của luồng hơi"], ["성대 진동의 유무만", "Chỉ có hay không rung dây thanh"], ["글자의 모양", "Hình chữ"], ["혀의 길이", "Độ dài lưỡi"]], "e": "Luồng khí đi qua miệng hoặc mũi là cơ sở phân loại."}, {"id": 10, "section": "A", "page": "37–38", "q": "구강음을 발음할 때 연구개와 목젖의 역할은?", "t": "Vai trò của ngạc mềm và lưỡi gà khi phát âm miệng?", "opts": [["코로 가는 공깃길을 차단한다.", "Chặn đường hơi lên mũi"], ["코로 가는 길을 열어 준다.", "Mở đường hơi lên mũi"], ["두 입술을 항상 닫는다.", "Luôn đóng hai môi"], ["성대를 진동시키지 않는다.", "Không làm rung dây thanh"]], "e": "Khi tạo âm miệng, ngạc mềm và lưỡi gà đóng đường hơi lên mũi."}, {"id": 11, "section": "A", "page": "38", "q": "한국어의 비음으로만 묶인 것은?", "t": "Nhóm nào chỉ gồm âm mũi tiếng Hàn?", "opts": [["ㄴ, ㅁ, ㅇ", "n, m, ng"], ["ㄴ, ㄹ, ㅁ", "n, l/r, m"], ["ㄱ, ㄴ, ㅁ", "g/k, n, m"], ["ㅁ, ㅂ, ㅍ", "m, b/p, p bật hơi"]], "e": "Ba âm mũi được nêu là ㄴ, ㅁ, ㅇ."}, {"id": 12, "section": "A", "page": "38", "q": "자음의 분류에서 가장 기본적인 두 기준은?", "t": "Hai tiêu chí cơ bản nhất để phân loại phụ âm?", "opts": [["조음위치와 조음방법", "Vị trí và phương thức cấu âm"], ["음절 수와 글자 수", "Số âm tiết và số chữ"], ["기의 세기와 글자 모양", "Mức độ bật hơi và hình chữ"], ["모음의 높이와 길이", "Độ cao và độ dài nguyên âm"]], "e": "Vị trí trả lời câu hỏi ở đâu (where), phương thức trả lời bằng cách nào (how)."}, {"id": 13, "section": "B", "page": "39–40", "q": "교재에 따르면 한국어 자음의 조음위치는 몇 가지인가?", "t": "Theo giáo trình, tiếng Hàn có bao nhiêu vị trí cấu âm phụ âm?", "opts": [["다섯 가지", "5 loại"], ["세 가지", "3 loại"], ["일곱 가지", "7 loại"], ["열 가지", "10 loại"]], "e": "Năm nhóm: 양순음, 치조음, 경구개음, 연구개음, 후음."}, {"id": 14, "section": "B", "page": "39–40", "q": "입의 앞쪽에서 뒤쪽으로 배열한 순서로 옳은 것은?", "t": "Thứ tự đúng từ trước ra sau của các vị trí cấu âm?", "opts": [["양순음-치조음-경구개음-연구개음-후음", "Hai môi – lợi – ngạc cứng – ngạc mềm – thanh hầu"], ["치조음-양순음-연구개음-경구개음-후음", "Lợi – hai môi – ngạc mềm – ngạc cứng – thanh hầu"], ["후음-양순음-치조음-경구개음-연구개음", "Thanh hầu – hai môi – lợi – ngạc cứng – ngạc mềm"], ["양순음-경구개음-치조음-후음-연구개음", "Hai môi – ngạc cứng – lợi – thanh hầu – ngạc mềm"]], "e": "Theo bảng trang 40, thứ tự bắt đầu ở môi và kết thúc ở thanh hầu."}, {"id": 15, "section": "B", "page": "39–40", "q": "혀의 뾰족한 끝부분을 가리키는 용어는?", "t": "Thuật ngữ chỉ phần nhọn ở đầu lưỡi?", "opts": [["설첨", "Chóp lưỡi"], ["설단", "Phiến lưỡi"], ["전설", "Phần trước lưỡi"], ["후설", "Phần sau lưỡi"]], "e": "설첨 (혀끝) là chóp lưỡi; 설단 (혓날) là phần ngay sau chóp."}, {"id": 16, "section": "B", "page": "39", "q": "성대에 해당하는 발음기관의 번호는? （그림 2）", "t": "Trong hình 2, dây thanh được đánh số nào?", "opts": [["15번", "Số 15"], ["12번", "Số 12"], ["13번", "Số 13"], ["14번", "Số 14"]], "e": "Hình 2: 12 비강, 13 구강, 14 인두, 15 성대."}, {"id": 17, "section": "B", "page": "40", "q": "양순음에 해당하는 자음의 전체 목록은?", "t": "Danh sách đầy đủ các phụ âm hai môi?", "opts": [["ㅂ, ㅃ, ㅍ, ㅁ", "Bốn âm hai môi"], ["ㄷ, ㄸ, ㅌ, ㄴ", "Bốn âm lợi"], ["ㄱ, ㄲ, ㅋ, ㅇ", "Bốn âm ngạc mềm"], ["ㅈ, ㅉ, ㅊ, ㅁ", "Ba âm ngạc cứng và ㅁ"]], "e": "Hai môi tạo vị trí cản trở luồng khí trong 양순음."}, {"id": 18, "section": "B", "page": "40–41", "q": "치조음에 해당하는 자음의 전체 목록은?", "t": "Danh sách đầy đủ các phụ âm lợi?", "opts": [["ㄷ, ㄸ, ㅌ, ㅅ, ㅆ, ㄴ, ㄹ", "Bảy âm lợi"], ["ㄷ, ㄸ, ㅌ, ㅈ, ㅉ, ㄴ, ㄹ", "Có ㅈ và ㅉ"], ["ㄱ, ㄲ, ㅋ, ㅅ, ㅆ, ㄴ, ㄹ", "Có ㄱ, ㄲ, ㅋ"], ["ㅂ, ㅃ, ㅍ, ㅅ, ㅆ, ㄴ, ㄹ", "Có ㅂ, ㅃ, ㅍ"]], "e": "Chi tiết bảng trang 40: 치조음 gồm 7 âm."}, {"id": 19, "section": "B", "page": "41", "q": "경구개음에 해당하는 것은?", "t": "Nhóm nào là âm ngạc cứng theo giáo trình?", "opts": [["ㅈ, ㅉ, ㅊ", "Ba âm ngạc cứng"], ["ㄱ, ㄲ, ㅋ", "Ba âm ngạc mềm"], ["ㅅ, ㅆ", "Hai âm xát lợi"], ["ㅂ, ㅃ, ㅍ", "Ba âm tắc hai môi"]], "e": "Phần trước lưỡi tiếp xúc hoặc tạo cản trở tại ngạc cứng."}, {"id": 20, "section": "B", "page": "42", "q": "연구개음으로만 묶인 것은?", "t": "Nhóm nào chỉ gồm âm ngạc mềm?", "opts": [["ㄱ, ㄲ, ㅋ, ㅇ", "Bốn âm ngạc mềm"], ["ㄱ, ㄲ, ㅋ, ㄴ", "Có ㄴ (âm lợi)"], ["ㅈ, ㅉ, ㅊ, ㅇ", "Có ba âm ngạc cứng"], ["ㅂ, ㅃ, ㅍ, ㅁ", "Bốn âm hai môi"]], "e": "Phần sau lưỡi và ngạc mềm tham gia tạo âm."}, {"id": 21, "section": "B", "page": "42", "q": "후음에 해당하는 한국어 자음은?", "t": "Phụ âm thanh hầu trong tiếng Hàn là gì?", "opts": [["ㅎ", "ㅎ"], ["ㅇ", "ㅇ"], ["ㅆ", "ㅆ"], ["ㅋ", "ㅋ"]], "e": "ㅎ được tạo tại khoảng giữa hai dây thanh."}, {"id": 22, "section": "B", "page": "40", "q": "‘신문’이 일상 구어에서 [심문]으로 발음되는 예가 보여 주는 것은?", "t": "Ví dụ 신문 phát âm [심문] trong khẩu ngữ minh họa điều gì?", "opts": [["연속된 자음의 조음위치를 같게 하려는 경향", "Xu hướng đồng nhất vị trí cấu âm của hai phụ âm liền nhau"], ["모음이 모두 탈락하는 현상", "Hiện tượng rụng mọi nguyên âm"], ["모든 자음이 격음이 되는 현상", "Mọi phụ âm trở thành âm bật hơi"], ["표준 표기가 바뀌는 현상", "Chữ viết chuẩn thay đổi"]], "e": "ㄴ đứng trước ㅁ có thể được phát âm thành ㅁ trong khẩu ngữ; không phải quy định viết hay phát âm chuẩn mới."}, {"id": 23, "section": "B", "page": "41", "q": "‘낯’의 받침 발음은 교재에서 어떻게 설명되는가?", "t": "Sách giải thích phát âm phụ âm cuối của 낯 như thế nào?", "opts": [["치조음 [ㄷ]으로 발음된다.", "Được phát âm thành âm lợi [ㄷ]"], ["경구개음 [ㅈ]으로 발음된다.", "Thành [ㅈ] ngạc cứng"], ["연구개음 [ㄱ]으로 발음된다.", "Thành [ㄱ] ngạc mềm"], ["양순음 [ㅂ]으로 발음된다.", "Thành [ㅂ] hai môi"]], "e": "Sách dùng 낯 để minh họa sự gần gũi giữa nhóm ngạc cứng và âm lợi trong hiện tượng âm vị."}, {"id": 24, "section": "B", "page": "42", "q": "교재에서 한국어에 없는 소리의 예로 든 것은?", "t": "Sách đưa âm nào làm ví dụ âm không có trong tiếng Hàn?", "opts": [["영어의 /f/, /v/", "Âm /f/, /v/ tiếng Anh"], ["한국어의 /ㅁ/, /ㄴ/", "Âm /ㅁ/, /ㄴ/"], ["한국어의 /ㄱ/, /ㅋ/", "Âm /ㄱ/, /ㅋ/"], ["한국어의 /ㅈ/, /ㅊ/", "Âm /ㅈ/, /ㅊ/"]], "e": "/f/, /v/ là âm môi-răng; sách cũng nêu /θ/, /ð/ và các vị trí khác."}, {"id": 25, "section": "C", "page": "42–43", "q": "조음방법의 일차적인 분류는?", "t": "Phân loại cấp đầu tiên theo phương thức cấu âm?", "opts": [["장애음과 공명자음", "Âm cản và phụ âm vang"], ["양순음과 치조음", "Âm hai môi và âm lợi"], ["평음과 격음", "Âm thường và âm bật hơi"], ["자음과 모음", "Phụ âm và nguyên âm"]], "e": "Phân loại bước đầu là 장애음 (obstruent) và 공명자음 (sonorant)."}, {"id": 26, "section": "C", "page": "43", "q": "공명자음의 두 하위 유형은?", "t": "Hai nhóm con của phụ âm vang?", "opts": [["비음과 유음", "Âm mũi và âm lỏng"], ["파열음과 마찰음", "Âm tắc và âm xát"], ["마찰음과 파찰음", "Âm xát và âm tắc xát"], ["평음과 경음", "Âm thường và âm căng"]], "e": "비음 ㄴ, ㅁ, ㅇ và 유음 ㄹ đều là 공명자음."}, {"id": 27, "section": "C", "page": "43", "q": "비음의 조음방법에 대한 설명으로 옳은 것은?", "t": "Mô tả nào đúng về phương thức tạo âm mũi?", "opts": [["입 안에서는 장애가 있지만 코로는 공기가 통한다.", "Có cản trở trong miệng nhưng hơi đi qua mũi"], ["코와 입을 모두 완전히 막는다.", "Chặn hoàn toàn cả mũi và miệng"], ["공기가 혀 옆으로만 나간다.", "Hơi chỉ đi qua hai bên lưỡi"], ["항상 성대가 진동하지 않는다.", "Dây thanh luôn không rung"]], "e": "Âm mũi có cản trở ở khoang miệng nhưng đường khí qua mũi vẫn mở."}, {"id": 28, "section": "C", "page": "43", "q": "한국어에서 유음에 해당하는 자음은?", "t": "Phụ âm lỏng của tiếng Hàn là gì?", "opts": [["ㄹ", "ㄹ"], ["ㄴ", "ㄴ"], ["ㅇ", "ㅇ"], ["ㅅ", "ㅅ"]], "e": "ㄹ là 유음 (liquid); giáo trình mô tả luồng khí có thể thoát qua bên lưỡi."}, {"id": 29, "section": "C", "page": "43", "q": "교재에 따르면 공명자음은 성대 진동 면에서 어떤 소리인가?", "t": "Theo sách, phụ âm vang thuộc loại nào xét theo rung dây thanh?", "opts": [["유성음", "Âm hữu thanh"], ["무성음", "Âm vô thanh"], ["격음만", "Chỉ âm bật hơi"], ["마찰음만", "Chỉ âm xát"]], "e": "공명자음 có đặc tính gần với nguyên âm, là âm hữu thanh."}, {"id": 30, "section": "C", "page": "43", "q": "파열음을 만드는 방법으로 옳은 것은?", "t": "Cách tạo âm tắc đúng là gì?", "opts": [["공기를 막았다가 한꺼번에 내보낸다.", "Chặn hơi rồi giải phóng đột ngột"], ["작은 틈을 계속 유지한다.", "Duy trì khe nhỏ liên tục"], ["코로만 공기를 내보낸다.", "Chỉ đưa hơi qua mũi"], ["혀 옆으로만 공기를 내보낸다.", "Chỉ đưa hơi qua bên lưỡi"]], "e": "파열음 còn được gọi là 폐쇄음; luồng hơi bị chặn rồi được giải phóng."}, {"id": 31, "section": "C", "page": "43–44", "q": "마찰음의 조음방법은?", "t": "Phương thức cấu âm của âm xát?", "opts": [["좁은 틈으로 공기를 보내 마찰을 일으킨다.", "Đưa hơi qua khe hẹp tạo ma sát"], ["완전히 막았다가 크게 터뜨린다.", "Chặn kín rồi bật ra mạnh"], ["공기가 코로만 나간다.", "Hơi chỉ qua mũi"], ["모음처럼 아무 장애도 없다.", "Không có cản trở như nguyên âm"]], "e": "ㅅ, ㅆ là ví dụ tiêu biểu được dùng để giải thích cách tạo ma sát."}, {"id": 32, "section": "C", "page": "44", "q": "파찰음의 조음방법은?", "t": "Phương thức tạo âm tắc xát?", "opts": [["완전히 막았다가 조금만 열어 마찰을 일으킨다.", "Chặn kín rồi mở khe nhỏ tạo ma sát"], ["처음부터 끝까지 아무 장애가 없다.", "Không cản trở từ đầu đến cuối"], ["코를 통해서만 공기가 나간다.", "Hơi chỉ qua mũi"], ["처음부터 틈을 유지하며 폐쇄하지 않는다.", "Chỉ giữ khe hẹp, không có giai đoạn tắc"]], "e": "파찰음 kết hợp giai đoạn tắc và giai đoạn xát; ㅈ, ㅉ, ㅊ."}, {"id": 33, "section": "C", "page": "44", "q": "장애음의 하위 유형이 아닌 것은?", "t": "Nhóm nào không thuộc âm cản?", "opts": [["유음", "Âm lỏng"], ["파열음", "Âm tắc"], ["마찰음", "Âm xát"], ["파찰음", "Âm tắc xát"]], "e": "유음 thuộc 공명음, không thuộc 장애음."}, {"id": 34, "section": "C", "page": "44", "q": "한국어의 마찰음 전체를 고른 것은?", "t": "Chọn toàn bộ âm xát tiếng Hàn theo bảng sách.", "opts": [["ㅅ, ㅆ, ㅎ", "Ba âm xát"], ["ㅅ, ㅆ, ㅊ", "Có ㅊ (tắc xát)"], ["ㅈ, ㅉ, ㅊ", "Ba âm tắc xát"], ["ㄱ, ㄲ, ㅋ", "Ba âm tắc"]], "e": "Bảng trang 44 xếp ㅅ, ㅆ vào âm xát lợi và ㅎ vào âm xát thanh hầu."}, {"id": 35, "section": "C", "page": "44", "q": "조음위치와 조음방법을 함께 고려할 때 ㅁ은?", "t": "Xét cả vị trí và phương thức cấu âm, ㅁ thuộc loại nào?", "opts": [["양순 비음", "Âm mũi hai môi"], ["치조 비음", "Âm mũi lợi"], ["양순 파열음", "Âm tắc hai môi"], ["연구개 비음", "Âm mũi ngạc mềm"]], "e": "ㅁ cùng vị trí với ㅂ, ㅃ, ㅍ nhưng khác phương thức cấu âm."}, {"id": 36, "section": "C", "page": "44", "q": "ㄹ의 조음위치와 조음방법은?", "t": "Vị trí và phương thức cấu âm của ㄹ?", "opts": [["치조 유음", "Âm lỏng lợi"], ["치조 비음", "Âm mũi lợi"], ["연구개 유음", "Âm lỏng ngạc mềm"], ["경구개 파찰음", "Âm tắc xát ngạc cứng"]], "e": "ㄹ là âm lỏng duy nhất trong bảng và thuộc vị trí 치조."}, {"id": 37, "section": "C", "page": "44–45", "q": "국물[궁물]에서 ㄱ이 ㅇ으로 바뀔 때 유지되는 것은?", "t": "Khi ㄱ đổi thành ㅇ trong 국물[궁물], yếu tố nào được giữ nguyên?", "opts": [["조음위치", "Vị trí cấu âm"], ["조음방법", "Phương thức cấu âm"], ["기의 세기", "Mức độ bật hơi"], ["글자 모양", "Hình chữ"]], "e": "ㄱ và ㅇ đều là âm ngạc mềm; phương thức chuyển từ âm tắc sang âm mũi trước ㅁ."}, {"id": 38, "section": "D", "page": "45", "q": "한국어 장애음은 기의 세기에 따라 주로 어떻게 분류되는가?", "t": "Âm cản tiếng Hàn chủ yếu được phân loại theo mức độ bật hơi như thế nào?", "opts": [["평음, 경음, 격음", "Âm thường, âm căng, âm bật hơi"], ["비음, 유음, 모음", "Âm mũi, âm lỏng, nguyên âm"], ["양순음, 치조음, 후음", "Âm hai môi, lợi, thanh hầu"], ["장음, 단음, 이중음", "Âm dài, âm ngắn, âm kép"]], "e": "Đối lập ba nhóm là đặc trưng nổi bật của hệ thống phụ âm Hàn."}, {"id": 39, "section": "D", "page": "45", "q": "기의 세기가 강한 것부터 약한 것까지 교재의 순서대로 배열한 것은?", "t": "Theo sách, thứ tự mức độ hơi từ mạnh đến yếu?", "opts": [["격음-평음-경음", "Bật hơi – thường – căng"], ["경음-평음-격음", "Căng – thường – bật hơi"], ["평음-경음-격음", "Thường – căng – bật hơi"], ["격음-경음-평음", "Bật hơi – căng – thường"]], "e": "Đây là thứ tự về lượng hơi theo cách trình bày của giáo trình, không phải thứ tự cao độ."}, {"id": 40, "section": "D", "page": "45", "q": "평음으로만 구성된 것은?", "t": "Nhóm nào chỉ gồm âm thường?", "opts": [["ㄱ, ㄷ, ㅂ, ㅅ, ㅈ", "Năm âm thường"], ["ㄲ, ㄸ, ㅃ, ㅆ, ㅉ", "Năm âm căng"], ["ㅋ, ㅌ, ㅍ, ㅊ", "Bốn âm bật hơi"], ["ㄴ, ㅁ, ㅇ, ㄹ", "Bốn âm vang"]], "e": "평음 còn được gọi là 예사소리."}, {"id": 41, "section": "D", "page": "45", "q": "경음으로만 구성된 것은?", "t": "Nhóm nào chỉ gồm âm căng?", "opts": [["ㄲ, ㄸ, ㅃ, ㅆ, ㅉ", "Năm âm căng"], ["ㄱ, ㄷ, ㅂ, ㅅ, ㅈ", "Năm âm thường"], ["ㅋ, ㅌ, ㅍ, ㅊ", "Bốn âm bật hơi"], ["ㄲ, ㄸ, ㅍ, ㅆ, ㅊ", "Có ㅍ và ㅊ bật hơi"]], "e": "경음 còn gọi là 된소리."}, {"id": 42, "section": "D", "page": "45", "q": "치조 마찰음의 대립에 대한 설명으로 옳은 것은?", "t": "Giải thích đúng về sự đối lập của âm xát lợi?", "opts": [["평음 ㅅ과 경음 ㅆ이 있고 격음은 없다.", "Có ㅅ thường, ㅆ căng, không có âm bật hơi tương ứng"], ["평음과 격음만 있다.", "Chỉ có âm thường và bật hơi"], ["경음과 격음만 있다.", "Chỉ có âm căng và bật hơi"], ["세 가지가 모두 있다.", "Có đầy đủ ba loại"]], "e": "Riêng nhóm âm xát lợi có hai âm đối lập, không có thành viên 격음 tương ứng."}, {"id": 43, "section": "D", "page": "46", "q": "ㅌ을 세 가지 기준으로 분류한 것은?", "t": "Phân loại ㅌ theo cả ba tiêu chí?", "opts": [["치조음-파열음-격음", "Lợi – tắc – bật hơi"], ["치조음-파찰음-격음", "Lợi – tắc xát – bật hơi"], ["양순음-파열음-경음", "Hai môi – tắc – căng"], ["연구개음-파열음-평음", "Ngạc mềm – tắc – thường"]], "e": "ㅌ thuộc cùng vị trí và phương thức với ㄷ, ㄸ, nhưng là âm bật hơi."}, {"id": 44, "section": "D", "page": "46", "q": "ㅉ을 세 가지 기준으로 분류한 것은?", "t": "Phân loại ㅉ theo ba tiêu chí?", "opts": [["경구개음-파찰음-경음", "Ngạc cứng – tắc xát – căng"], ["치조음-마찰음-경음", "Lợi – xát – căng"], ["경구개음-파열음-격음", "Ngạc cứng – tắc – bật hơi"], ["연구개음-파찰음-평음", "Ngạc mềm – tắc xát – thường"]], "e": "ㅉ cùng nhóm với ㅈ, ㅊ về vị trí và phương thức, nhưng là 경음."}, {"id": 45, "section": "D", "page": "46–47", "q": "한국어와 영어의 양순 파열음 대립을 비교한 설명으로 옳은 것은?", "t": "So sánh đúng về đối lập âm tắc hai môi Hàn và Anh?", "opts": [["한국어는 ㅂ, ㅃ, ㅍ의 세 계열이고 영어는 /p/, /b/의 두 계열이다.", "Hàn có ba nhóm, Anh có hai nhóm /p/, /b/"], ["두 언어 모두 세 계열이다.", "Cả hai có ba nhóm"], ["한국어는 /p/, /b/만 대립한다.", "Hàn chỉ có /p/, /b/"], ["영어에는 양순 파열음이 없다.", "Anh không có âm tắc hai môi"]], "e": "Sách nhấn mạnh khác biệt về số lượng và bản chất đối lập âm vị."}, {"id": 46, "section": "D", "page": "47", "q": "‘달, 탈, 딸’은 무엇의 대립을 보여 주는가?", "t": "달, 탈, 딸 minh họa sự đối lập nào?", "opts": [["평음, 격음, 경음", "Âm thường, bật hơi, căng"], ["비음, 유음, 파열음", "Âm mũi, lỏng, tắc"], ["양순음, 치조음, 후음", "Hai môi, lợi, thanh hầu"], ["유성음만의 대립", "Chỉ đối lập giữa âm hữu thanh"]], "e": "달 (mặt trăng), 탈 (mặt nạ), 딸 (con gái) minh họa chức năng phân biệt nghĩa của ba nhóm."}, {"id": 47, "section": "D", "page": "47", "q": "언어 보편적(language universal) 자음 분류 기준은?", "t": "Tiêu chí phân loại phụ âm có tính phổ quát giữa các ngôn ngữ?", "opts": [["조음위치와 조음방법", "Vị trí và phương thức cấu âm"], ["평음, 경음, 격음의 대립", "Đối lập thường, căng, bật hơi"], ["한국어의 글자 모양", "Hình chữ tiếng Hàn"], ["유성 장애음의 존재 여부만", "Chỉ việc có âm cản hữu thanh hay không"]], "e": "Vị trí và phương thức là tiêu chí phổ quát; các đối lập riêng có thể khác giữa các ngôn ngữ."}, {"id": 48, "section": "D", "page": "47", "q": "해당 언어에만 적용되는(language specific) 자음 분류 기준의 예는?", "t": "Ví dụ tiêu chí phân loại mang tính đặc thù ngôn ngữ?", "opts": [["평음·경음·격음의 구분", "Phân biệt âm thường, căng, bật hơi"], ["조음방법", "Phương thức cấu âm"], ["조음위치", "Vị trí cấu âm"], ["파열음·마찰음·파찰음의 구분", "Phân biệt âm tắc, xát, tắc xát"]], "e": "Theo khung trang 47, đối lập thường/căng/bật hơi là tiêu chí đặc thù; đối lập hữu thanh/vô thanh của âm cản cũng được sách xếp vào loại này."}, {"id": 49, "section": "D", "page": "47", "q": "유성음과 무성음의 차이를 결정하는 것은?", "t": "Yếu tố quyết định sự khác biệt hữu thanh và vô thanh?", "opts": [["성대의 진동 유무", "Có hay không rung dây thanh"], ["혀의 앞뒤 위치만", "Chỉ vị trí trước sau của lưỡi"], ["입술의 모양만", "Chỉ hình dạng môi"], ["글자의 획수", "Số nét chữ"]], "e": "유성음 có rung dây thanh; 무성음 không rung dây thanh."}, {"id": 50, "section": "D", "page": "47", "q": "교재에 따르면 한 종류의 장애음만 가진 언어에서 그 장애음은?", "t": "Theo sách, nếu một ngôn ngữ chỉ có một nhóm âm cản xét đối lập thanh tính, nhóm đó là gì?", "opts": [["무성 장애음", "Âm cản vô thanh"], ["유성 장애음", "Âm cản hữu thanh"], ["비음", "Âm mũi"], ["유음", "Âm lỏng"]], "e": "Khung kiến thức trang 47 xem âm cản vô thanh là loại cơ bản, âm cản hữu thanh có tính tùy chọn."}, {"id": 51, "section": "E", "page": "62", "q": "한국어 자음과 모음을 가르칠 때 가장 먼저 강조해야 할 활동은?", "t": "Khi dạy phụ âm và nguyên âm tiếng Hàn, hoạt động nào cần được chú trọng trước tiên?", "opts": [["듣기 활동", "Hoạt động nghe"], ["받아쓰기 시험만", "Chỉ thi chính tả"], ["빠르게 문장 읽기", "Đọc câu nhanh"], ["문법 설명", "Giải thích ngữ pháp"]], "e": "Sách nhấn mạnh cần nhận biết âm chính xác qua nghe trước khi phát âm."}, {"id": 52, "section": "E", "page": "62", "q": "발음 교육에서 듣기 활동을 먼저 하는 이유로 적절하지 않은 것은?", "t": "Lý do nào không phù hợp với việc ưu tiên nghe trước khi phát âm?", "opts": [["처음부터 모든 발음 오류를 완전히 없애기 때문이다.", "Vì loại bỏ hoàn toàn mọi lỗi ngay từ đầu"], ["소리를 올바르게 인식하는 데 도움이 된다.", "Giúp nhận biết âm chính xác"], ["학습자의 심리적 부담을 줄일 수 있다.", "Có thể giảm gánh nặng tâm lý"], ["유사한 소리의 차이를 인식하게 한다.", "Giúp nhận biết khác biệt giữa các âm tương tự"]], "e": "Nghe là bước chuẩn bị có ích, nhưng sách không khẳng định nghe sẽ loại bỏ mọi lỗi ngay lập tức."}, {"id": 53, "section": "E", "page": "62", "q": "유사한 두 소리의 차이를 인식시키는 데 유용한 것은?", "t": "Công cụ hữu ích để nhận biết khác biệt giữa hai âm gần nhau?", "opts": [["최소대립어", "Các từ đối lập tối thiểu"], ["긴 문법 정의만", "Chỉ định nghĩa ngữ pháp dài"], ["번역문만", "Chỉ bản dịch"], ["음절 수 세기만", "Chỉ đếm âm tiết"]], "e": "최소대립어 giúp người học tập trung vào khác biệt giữa các âm mục tiêu."}, {"id": 54, "section": "E", "page": "62", "q": "조음위치와 조음방법을 구체적으로 설명하는 도구로 교재가 권하는 것은?", "t": "Công cụ sách khuyên dùng để giải thích cụ thể vị trí và phương thức cấu âm?", "opts": [["그림, 손, 입모양 상자 모형", "Hình, bàn tay, mô hình miệng bằng hộp"], ["사전만", "Chỉ từ điển"], ["문법 시험지", "Đề thi ngữ pháp"], ["번역기만", "Chỉ công cụ dịch"]], "e": "Sách đề xuất kết hợp hình và mô hình ba chiều, sử dụng bàn tay đeo găng để minh họa."}, {"id": 55, "section": "E", "page": "62–63", "q": "한국어 자음 교육에서 조음방법에 따라 학습 방법을 달리하는 이유는?", "t": "Vì sao nên thay đổi cách dạy tùy phương thức cấu âm?", "opts": [["조음위치가 비교적 단순하므로 소리가 만들어지는 방법에 주목할 필요가 있기 때문이다.", "Vị trí tương đối đơn giản nên cần chú ý cách tạo âm"], ["한국어 자음에는 조음위치가 없기 때문이다.", "Vì phụ âm Hàn không có vị trí cấu âm"], ["모든 자음의 조음방법이 같기 때문이다.", "Vì mọi phụ âm có cùng phương thức"], ["모든 학습자가 한국어 소리를 이미 알기 때문이다.", "Vì mọi người học đã biết âm tiếng Hàn"]], "e": "Theo lập luận ở trang 62–63, cần thiết kế cách dạy theo phương thức tạo âm."}, {"id": 56, "section": "E", "page": "63", "q": "종이나 휴지를 이용한 파열음 연습에서 종이가 가장 많이 흔들리는 것은?", "t": "Khi luyện âm tắc bằng giấy hoặc khăn giấy, âm nào làm giấy rung mạnh nhất?", "opts": [["격음", "Âm bật hơi"], ["경음", "Âm căng"], ["평음", "Âm thường"], ["유음", "Âm lỏng"]], "e": "Giấy hoặc khăn giấy minh họa lượng hơi thoát ra; 격음 mạnh nhất theo sách."}, {"id": 57, "section": "E", "page": "63", "q": "공기의 세기 차이를 느끼게 할 때 처음에 가르치기 좋은 파열음은?", "t": "Khi dạy cảm nhận lượng hơi, nên bắt đầu với âm tắc nào?", "opts": [["양순 파열음 ㅃ, ㅂ, ㅍ", "Âm tắc hai môi ㅃ, ㅂ, ㅍ"], ["연구개 파열음 ㄲ, ㄱ, ㅋ", "Âm tắc ngạc mềm"], ["치조 파열음 ㄸ, ㄷ, ㅌ", "Âm tắc lợi"], ["경구개 파찰음 ㅉ, ㅈ, ㅊ", "Âm tắc xát ngạc cứng"]], "e": "Sách khuyên bắt đầu với âm hai môi vì dễ cảm nhận lượng hơi nhất."}, {"id": 58, "section": "E", "page": "64", "q": "교재가 제시하는 소리 높낮이의 순서로 옳은 것은? （낮은 소리 → 높은 소리）", "t": "Thứ tự cao độ được sách trình bày từ thấp đến cao là gì?", "opts": [["평음-경음-격음", "Thường – căng – bật hơi"], ["경음-평음-격음", "Căng – thường – bật hơi"], ["격음-평음-경음", "Bật hơi – thường – căng"], ["격음-경음-평음", "Bật hơi – căng – thường"]], "e": "Phân biệt cao độ với lượng hơi: đây là mô tả phương pháp dạy theo cao độ ở trang 64, không phải quy luật cố định của mọi người nói."}, {"id": 59, "section": "E", "page": "64", "q": "글자 모양을 활용한 파열음 제시 순서로 교재가 권하는 것은?", "t": "Thứ tự trình bày âm tắc dựa trên hình chữ theo sách?", "opts": [["평음-경음-격음", "Thường – căng – bật hơi"], ["격음-경음-평음", "Bật hơi – căng – thường"], ["경음-격음-평음", "Căng – bật hơi – thường"], ["격음-평음-경음", "Bật hơi – thường – căng"]], "e": "Âm căng được viết bằng cách lặp chữ âm thường, nên sách gợi ý thứ tự này."}, {"id": 60, "section": "E", "page": "64", "q": "개별 파열음 학습 후 복습 방법으로 제시된 것은?", "t": "Sau khi học từng âm tắc, sách đề xuất ôn bằng cách nào?", "opts": [["최소대립쌍을 듣고 고르기, 받아 적기, 발음하기", "Nghe chọn, viết chính tả, phát âm cặp đối lập tối thiểu"], ["글자만 눈으로 보기", "Chỉ nhìn chữ"], ["문법 용어 외우기", "Thuộc thuật ngữ ngữ pháp"], ["듣기 없이 번역하기", "Dịch mà không nghe"]], "e": "Ba hoạt động phối hợp nhận biết và sản sinh âm."}, {"id": 61, "section": "E", "page": "64", "q": "ㅅ과 ㅆ의 발음을 지도할 때 혀끝은 어디에 두어야 하는가?", "t": "Khi dạy ㅅ và ㅆ, nên đặt đầu lưỡi ở đâu?", "opts": [["치조에 가깝게 두되 완전히 붙이지 않는다.", "Đặt gần lợi nhưng không áp kín"], ["치조에 완전히 붙여 공기를 막는다.", "Áp kín lợi, chặn hơi"], ["두 입술 사이에 둔다.", "Đặt giữa hai môi"], ["목젖에 닿게 한다.", "Chạm lưỡi gà"]], "e": "Âm xát cần khe hẹp để luồng hơi tạo ma sát."}, {"id": 62, "section": "E", "page": "64", "q": "‘사’와 ‘시’의 ㅅ 발음이 달라지는 직접적인 이유는?", "t": "Vì sao âm ㅅ trong 사 và 시 khác nhau?", "opts": [["뒤에 오는 모음의 영향", "Ảnh hưởng của nguyên âm theo sau"], ["앞에 오는 받침의 영향", "Ảnh hưởng của phụ âm cuối phía trước"], ["글자의 획수", "Số nét chữ"], ["단어의 의미만", "Chỉ nghĩa từ"]], "e": "ㅅ có các biến thể âm (변이음) phụ thuộc nguyên âm sau nó."}, {"id": 63, "section": "E", "page": "64–65", "q": "ㅅ 교육의 모음 결합 순서로 교재가 제시하는 것은?", "t": "Thứ tự kết hợp nguyên âm khi dạy ㅅ theo giáo trình?", "opts": [["사·서 → 소·수 → 시·셔", "사, 서 → 소, 수 → 시, 셔"], ["시·셔 → 소·수 → 사·서", "시, 셔 → 소, 수 → 사, 서"], ["소·수 → 시·셔 → 사·서", "소, 수 → 시, 셔 → 사, 서"], ["시·셔만 반복", "Chỉ lặp 시, 셔"]], "e": "Bắt đầu với dạng ít biến đổi, tiếp theo nguyên âm tròn môi, cuối cùng là ㅣ hoặc bán nguyên âm /y/."}, {"id": 64, "section": "E", "page": "65", "q": "한국어 ㅎ을 처음 가르칠 때 권장되는 것은?", "t": "Khi mới dạy ㅎ, sách khuyên dạy điều gì?", "opts": [["어두에서의 ㅎ부터 가르친다.", "Dạy ㅎ ở đầu từ trước"], ["모든 위치의 음운 변동부터 가르친다.", "Dạy mọi biến đổi âm vị trước"], ["ㅎ을 가르치지 않는다.", "Không dạy ㅎ"], ["받침에서만 가르친다.", "Chỉ dạy ㅎ ở cuối âm tiết"]], "e": "Ở các vị trí khác, ㅎ có thể kết hợp tạo âm bật hơi, rụng hoặc yếu đi; sách dạy khi tình huống tương ứng xuất hiện."}, {"id": 65, "section": "E", "page": "65", "q": "학습자가 ㅅ과 ㅈ을 구별하지 못할 때 효과적인 설명은?", "t": "Nếu người học không phân biệt ㅅ và ㅈ, nên giải thích gì?", "opts": [["조음위치와 조음방법의 차이", "Khác biệt vị trí và phương thức cấu âm"], ["두 글자의 의미 차이만", "Chỉ khác biệt nghĩa của hai chữ"], ["두 소리가 동일하다고 설명하기", "Nói hai âm giống nhau"], ["글자를 반복해서 쓰기만 하기", "Chỉ viết lặp lại chữ"]], "e": "Mô hình miệng giúp minh họa sự khác biệt giữa âm xát và tắc xát."}, {"id": 66, "section": "E", "page": "65", "q": "파찰음의 평음·경음·격음 구별 연습에 활용할 수 있는 것은?", "t": "Có thể dùng gì khi luyện phân biệt âm thường, căng, bật hơi của âm tắc xát?", "opts": [["종이, 휴지, 손바닥", "Giấy, khăn giấy, lòng bàn tay"], ["사전의 뜻풀이만", "Chỉ giải nghĩa từ điển"], ["모음의 글자 수만", "Chỉ số chữ nguyên âm"], ["받침의 개수만", "Chỉ số phụ âm cuối"]], "e": "Có thể ứng dụng cách cảm nhận hơi như khi dạy âm tắc và kết hợp khác biệt cao độ."}, {"id": 67, "section": "E", "page": "66", "q": "외국인 학습자에게 한국어 어두 비음 ㄴ, ㅁ이 다르게 들리는 이유로 교재가 제시한 것은?", "t": "Theo sách, vì sao người nước ngoài có thể nghe khác âm mũi đầu từ ㄴ, ㅁ?", "opts": [["어두 비음의 비음성이 약하기 때문이다.", "Tính mũi ở đầu từ khá yếu"], ["항상 격음으로 발음되기 때문이다.", "Luôn phát âm thành âm bật hơi"], ["한국어에 비음이 없기 때문이다.", "Tiếng Hàn không có âm mũi"], ["모음이 항상 탈락하기 때문이다.", "Nguyên âm luôn rụng"]], "e": "Sách nêu 누구, 나비, 노래, 모두, 모기 có thể bị nghe nhầm thành âm thường cùng vị trí cấu âm."}, {"id": 68, "section": "E", "page": "66", "q": "한국어 비음을 처음 지도할 때 교사에게 권장되는 방법은?", "t": "Khi mới dạy âm mũi Hàn, sách khuyên giáo viên làm gì?", "opts": [["학습자가 익숙해질 때까지 비음성을 강조한다.", "Nhấn mạnh tính mũi đến khi người học quen"], ["비음성을 없애서 발음한다.", "Loại bỏ tính mũi"], ["듣기 활동을 생략한다.", "Bỏ hoạt động nghe"], ["모든 비음을 ㅇ으로 발음한다.", "Phát âm mọi âm mũi thành ㅇ"]], "e": "Giáo viên có thể chủ động nhấn mạnh đặc tính âm mũi để người học dễ nhận ra."}, {"id": 69, "section": "E", "page": "66", "q": "어말 비음을 구별하는 연습에 적절한 최소대립쌍은?", "t": "Nhóm đối lập tối thiểu phù hợp để luyện âm mũi cuối từ?", "opts": [["감, 강, 간", "감, 강, 간"], ["달, 탈, 딸", "달, 탈, 딸"], ["자, 짜, 차", "자, 짜, 차"], ["사, 싸, 서", "사, 싸, 서"]], "e": "감/강/간 khác ở âm mũi cuối ㅁ/ㅇ/ㄴ."}, {"id": 70, "section": "E", "page": "66–67", "q": "한국어 ㄹ이 모음 사이에서 발음될 때 교재가 엄밀하게 제시한 음은?", "t": "Theo mô tả chính xác trong sách, ㄹ giữa hai nguyên âm là âm gì?", "opts": [["탄설음 [ɾ]", "Âm vỗ lưỡi [ɾ]"], ["전동음 [r]", "Âm rung [r]"], ["비음 [n]", "Âm mũi [n]"], ["파열음 [t]", "Âm tắc [t]"]], "e": "Sách phân biệt âm vỗ một lần với âm rung nhiều lần."}, {"id": 71, "section": "E", "page": "66", "q": "휴지 앞이나 자음 앞의 ㄹ은 일반적으로 어떤 소리로 제시되는가?", "t": "ㄹ trước chỗ ngừng hoặc trước phụ âm thường được sách mô tả là âm nào?", "opts": [["[l]", "Âm bên [l]"], ["[ɾ]", "Âm vỗ [ɾ]"], ["[ŋ]", "Âm mũi ngạc mềm"], ["[s]", "Âm xát [s]"]], "e": "Sách khuyên phân biệt ㄹ theo môi trường và dạy ㄹ cuối âm tiết trong phần 받침."}, {"id": 72, "section": "E", "page": "67", "q": "전동음과 탄설음의 차이는?", "t": "Khác biệt giữa âm rung và âm vỗ là gì?", "opts": [["혀끝을 여러 번 떠는지 한 번 튕기는지의 차이", "Đầu lưỡi rung nhiều lần hay vỗ một lần"], ["입술을 열거나 닫는 차이", "Môi mở hay đóng"], ["콧길을 여는지의 차이만", "Chỉ việc mở đường mũi"], ["두 음은 완전히 같다.", "Hai âm hoàn toàn giống nhau"]], "e": "전동음 [r] có nhiều lần rung; 탄설음 [ɾ] có một lần chạm/vỗ nhanh."}, {"id": 73, "section": "E", "page": "67", "q": "모음 사이의 ㄹ을 연습하기 위해 교재가 제시한 한국어 낱말은?", "t": "Từ tiếng Hàn được sách dùng luyện ㄹ giữa nguyên âm?", "opts": [["아래, 오리", "Bên dưới, con vịt"], ["감, 강", "Quả hồng, sông"], ["달, 딸", "Trăng, con gái"], ["사, 싸", "사, 싸"]], "e": "아래 và 오리 là ví dụ luyện lặp lại âm ㄹ giữa hai nguyên âm."}, {"id": 74, "section": "F", "page": "68", "q": "초급 학습자의 파열음 인지도 알아보기 활동에서 O의 의미는?", "t": "Trong hoạt động khảo sát nhận biết âm tắc sơ cấp, O có nghĩa gì?", "opts": [["모국어와 같은 발음으로 인식한다.", "Cảm nhận giống âm trong tiếng mẹ đẻ"], ["모국어와 다른 발음으로 인식한다.", "Cảm nhận khác tiếng mẹ đẻ"], ["정답을 모른다는 뜻이다.", "Không biết đáp án"], ["발음이 틀렸다는 뜻이다.", "Phát âm sai"]], "e": "O/X ở đây phản ánh nhận thức của người học, không phải điểm đúng sai khách quan."}, {"id": 75, "section": "F", "page": "68", "q": "‘듣고 따라하기’ 활동의 핵심은?", "t": "Trọng tâm của hoạt động nghe và nhắc lại?", "opts": [["교사의 정확한 발음을 듣고 모방한다.", "Nghe phát âm chính xác của giáo viên rồi bắt chước"], ["글자만 보고 뜻을 번역한다.", "Chỉ nhìn chữ và dịch nghĩa"], ["교사 없이 자유롭게 글을 쓴다.", "Tự do viết không cần giáo viên"], ["문법 오류만 찾는다.", "Chỉ tìm lỗi ngữ pháp"]], "e": "Hoạt động kết hợp đầu vào âm thanh với thực hành bắt chước phát âm."}, {"id": 76, "section": "F", "page": "71–72", "q": "‘듣고 어두 자음 쓰기’의 목적은?", "t": "Mục đích của hoạt động nghe và viết phụ âm đầu?", "opts": [["들은 음절의 첫 자음을 구별하여 쓰는 것", "Phân biệt rồi viết phụ âm đầu của âm tiết nghe được"], ["단어의 뜻만 쓰는 것", "Chỉ viết nghĩa từ"], ["문장 전체를 번역하는 것", "Dịch cả câu"], ["받침만 쓰는 것", "Chỉ viết phụ âm cuối"]], "e": "Giáo viên có thể cung cấp sẵn nguyên âm để người học tập trung vào phụ âm đầu."}, {"id": 77, "section": "F", "page": "72", "q": "중급 이상 파열음 듣기 활동에서 가장 중점을 두는 것은?", "t": "Trọng tâm nghe âm tắc dành cho trung cấp trở lên?", "opts": [["교사가 발음한 낱말과 개별음의 인지", "Nhận biết từ giáo viên phát âm và từng âm"], ["낱말의 뜻을 모두 외우기", "Thuộc nghĩa mọi từ"], ["문장 문법 분석", "Phân tích ngữ pháp câu"], ["번역문의 정확성", "Độ chính xác bản dịch"]], "e": "Sách dùng 바르다/빠르다/파르다 để kiểm tra nhận biết âm; nghĩa từ không phải trọng tâm."}, {"id": 78, "section": "F", "page": "72", "q": "‘받아쓰기’가 발음 교육에 유용한 이유는?", "t": "Vì sao viết chính tả có ích trong dạy phát âm?", "opts": [["학습자의 개별음 인지 상태를 확인할 수 있다.", "Kiểm tra người học nhận biết từng âm như thế nào"], ["모든 발음을 직접 평가할 수 있다.", "Đánh giá trực tiếp mọi phát âm"], ["듣기 없이 발음을 교정한다.", "Sửa phát âm mà không nghe"], ["문법 지식만 평가한다.", "Chỉ đánh giá ngữ pháp"]], "e": "Viết lại từ nghe được cho biết khả năng nhận biết âm, nhưng không trực tiếp đo khả năng phát âm."}, {"id": 79, "section": "F", "page": "73", "q": "교재의 ‘벼, 펴, 뼈’는 어떤 연습에 적절한가?", "t": "벼, 펴, 뼈 phù hợp luyện nội dung nào?", "opts": [["양순 파열음의 평음·격음·경음 구별", "Phân biệt thường, bật hơi, căng của âm tắc hai môi"], ["치조 비음의 구별", "Phân biệt âm mũi lợi"], ["유음의 받침 발음", "Âm lỏng ở phụ âm cuối"], ["모음의 장단 구별만", "Chỉ độ dài nguyên âm"]], "e": "Ba từ có âm đầu ㅂ/ㅍ/ㅃ, giúp tập trung vào sự đối lập âm tắc."}, {"id": 80, "section": "F", "page": "73,81", "q": "‘문장 읽기’에서 경음화가 일어나는 낱말을 배제하는 것이 좋은 이유는?", "t": "Vì sao sách khuyên tránh từ có hiện tượng căng hóa khi luyện đọc câu ở phần này?", "opts": [["목표 자음의 구별과 정확한 발음에 집중하도록 하기 위해서", "Để tập trung phân biệt và phát âm chính xác âm mục tiêu"], ["경음화가 한국어에 존재하지 않아서", "Vì tiếng Hàn không có căng hóa"], ["문장 읽기는 의미가 없어서", "Vì đọc câu không có ý nghĩa"], ["모든 문장을 모음으로만 읽기 위해서", "Để đọc mọi câu chỉ bằng nguyên âm"]], "e": "Đây là khuyến nghị khi luyện âm riêng lẻ trong câu, không có nghĩa là bỏ qua dạy biến đổi âm vị nói chung."}, {"id": 81, "section": "F", "page": "74,82", "q": "‘말꼬기 활동’의 목적은?", "t": "Mục đích của hoạt động luyện câu líu lưỡi?", "opts": [["유사한 발음의 차이를 알고 정확하게 발음하도록 한다.", "Nhận biết khác biệt và phát âm chính xác các âm gần nhau"], ["새로운 문법만 설명한다.", "Chỉ giải thích ngữ pháp mới"], ["외국어 철자를 외운다.", "Học thuộc chữ ngoại ngữ"], ["발음을 하지 않고 듣기만 한다.", "Chỉ nghe mà không phát âm"]], "e": "Hoạt động luyện phát âm các âm tương tự trong chuỗi từ, câu khó."}, {"id": 82, "section": "F", "page": "74–75,82", "q": "‘귓속말로 말해요’에서 마지막 학습자가 하는 일은?", "t": "Trong trò truyền lời thì thầm, người cuối cùng làm gì?", "opts": [["들은 낱말을 종이에 적는다.", "Viết từ nghe được lên giấy"], ["새로운 낱말을 임의로 만든다.", "Tự tạo một từ mới"], ["정답을 먼저 다른 사람에게 알려 준다.", "Báo đáp án trước cho người khác"], ["교사의 문법 설명을 듣는다.", "Nghe giáo viên giảng ngữ pháp"]], "e": "Nhóm 3–5 người truyền từ bằng lời thì thầm; người cuối viết ra để kiểm tra sự nhận biết và truyền âm."}, {"id": 83, "section": "F", "page": "75", "q": "한글 타자 배우기 활동에서 학습자가 하는 것은?", "t": "Trong trò học gõ Hang const root=document.getElementById('app'), key='korean-ch2-quiz-v1';let saved={wrong:[],done:{},session:null};let persistent=true;try{const x=JSON.parse(localStorage.getItem(key)||'null');if(x&&Array.isArray(x.wrong)&&x.done)saved=x;localStorage.setItem(key,JSON.stringify(saved))}catch(e){persistent=false}let S=null;

const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function home(){root.innerHTML=`<section class="panel"><div class="eyebrow">33 ẢNH GIÁO TRÌNH · ${Q.length} CÂU</div><h2 style="margin:8px 0">Ôn thi phụ âm tiếng Hàn</h2><p class="muted">Câu hỏi tiếng Hàn, dịch từng đáp án, giải thích tiếng Việt và trang tham khảo.</p><div class="stats"><div><b>${Object.keys(saved.done).length}/${Q.length}</b><small>Đã làm</small></div><div><b>${Object.values(saved.done).filter(Boolean).length}</b><small>Đúng gần nhất</small></div><div><b>${saved.wrong.length}</b><small>Cần ôn</small></div></div>${saved.session&&saved.session.pos<saved.session.items.length?'<button class="btn" id="resume">Tiếp tục bài đang làm</button>':''}<label for="mode">Chế độ</label><select id="mode"><option value="study">Học từng câu · giải thích ngay</option><option value="exam">Thi thử · giải thích cuối bài</option></select><label for="limit">Số câu mỗi lượt</label><select id="limit"><option value="0">Tất cả câu trong phần chọn</option><option value="10">10 câu ngẫu nhiên</option><option value="20">20 câu ngẫu nhiên</option><option value="30">30 câu ngẫu nhiên</option></select><button class="btn" id="all">Bắt đầu ôn tổng hợp</button><button class="btn alt" id="wrong" ${saved.wrong.length?'':'disabled'}>Ôn câu sai (${saved.wrong.length})</button></section><section class="panel"><h3>Ôn theo từng mục</h3>${Object.entries(topics).map(([k,v])=>`<button class="topic" data-topic="${k}"><div><strong>${v[0]}</strong><span>${v[1]}</span></div><b class="count">${Q.filter(q=>q.section===k).length} câu ›</b></button>`).join('')}</section><details><summary>Bảng phụ âm trọng tâm (tr. 40, 44–46)</summary><div class="tablewrap"><table><tr><th>조음방법</th><th>양순음</th><th>치조음</th><th>경구개음</th><th>연구개음</th><th>후음</th></tr><tr><td>파열음</td><td>ㅂ ㅃ ㅍ</td><td>ㄷ ㄸ ㅌ</td><td>—</td><td>ㄱ ㄲ ㅋ</td><td>—</td></tr><tr><td>마찰음</td><td>—</td><td>ㅅ ㅆ</td><td>—</td><td>—</td><td>ㅎ</td></tr><tr><td>파찰음</td><td>—</td><td>—</td><td>ㅈ ㅉ ㅊ</td><td>—</td><td>—</td></tr><tr><td>비음</td><td>ㅁ</td><td>ㄴ</td><td>—</td><td>ㅇ</td><td>—</td></tr><tr><td>유음</td><td>—</td><td>ㄹ</td><td>—</td><td>—</td><td>—</td></tr></table></div><p>기의 세기: 격음 → 평음 → 경음 (mạnh đến yếu, theo sách).</p></details><p class="muted">${persistent?'Tiến độ được lưu trên trình duyệt này nếu trình duyệt tiếp tục cho phép.':'Trình duyệt không cho phép lưu tiến độ; chỉ giữ trong phiên đang mở.'}</p>`;
const startMode=()=>document.getElementById('mode').value,limit=()=>Number(document.getElementById('limit').value);document.getElementById('all').onclick=()=>start(Q.map(q=>q.id),startMode(),limit());document.getElementById('wrong').onclick=()=>start(saved.wrong,'study',0);root.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>start(Q.filter(q=>q.section===b.dataset.topic).map(q=>q.id),startMode(),limit()));const r=document.getElementById('resume');if(r)r.onclick=()=>{S=saved.session;render()};}
function start(ids,mode,n){let selected=shuffle(ids);if(n)selected=selected.slice(0,n);if(!selected.length)return;S={mode,pos:0,items:selected.map(id=>({id,order:shuffle([0,1,2,3]),answer:null}))};store();render()}
function feedback(q,a){return `<div class="feedback"><strong class="${a===0?'green':'red'}">${a===0?'Chính xác!':'Chưa đúng.'}</strong><p class="translation"><b>Dịch câu hỏi:</b> ${esc(q.t)}</p>${q.opts.map((o,i)=>({o,i})).sort((a,b)=>a.i-b.i).map(({o,i})=>`<p class="${i===0?'green':i===a?'red':'translation'}">${i===0?'✓':'•'} ${esc(o[0])} → ${esc(o[1])}${i===a&&i!==0?' (bạn chọn)':''}</p>`).join('')}<p><b>Giải thích:</b> ${esc(q.e)}</p><p class="muted">📖 Giáo trình · tr. ${esc(q.page)}</p></div>`}
function render(){if(S.pos>=S.items.length){result();return}let item=S.items[S.pos],q=Q[item.id],a=item.answer,study=S.mode==='study',reveal=study&&a!==null;let answered=S.items.filter(i=>i.answer!==null),correct=answered.filter(i=>i.answer===0).length;root.innerHTML=`<div class="row muted"><span>Câu ${S.pos+1}/${S.items.length} · ${study?'Ôn tập':'Thi thử'}</span><span>${study?`Đúng ${correct} · Sai ${answered.length-correct}`:`Đã trả lời ${answered.length}`}</span></div><div class="track"><div class="fill" style="width:${answered.length/S.items.length*100}%"></div></div><section class="panel"><p class="eyebrow">${esc(topics[q.section][0])}</p><h2 lang="ko">${esc(q.q)}</h2>${item.order.map(j=>`<button lang="ko" class="opt ${reveal?(j===0?'good':j===a?'bad':''):a===j?'selected':''}" data-answer="${j}" ${reveal?'disabled':''}>${esc(q.opts[j][0])}${reveal&&j===0?' ✓':''}${reveal&&j===a&&j!==0?' ✕':''}</button>`).join('')}${reveal?feedback(q,a):''}<button class="btn" id="next" ${a===null?'disabled':''}>${S.pos===S.items.length-1?'Xem kết quả':'Câu tiếp theo →'}</button>${!study&&S.pos>0?'<button class="btn alt" id="prev">← Câu trước</button>':''}</section>`;root.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(study&&item.answer!==null)return;item.answer=Number(b.dataset.answer);if(study)record(item);store();render()});document.getElementById('next').onclick=()=>{if(item.answer===null)return;S.pos++;store();render();window.scrollTo(0,0)};let prev=document.getElementById('prev');if(prev)prev.onclick=()=>{S.pos--;store();render();window.scrollTo(0,0)}}
function record(i){saved.done[i.id]=i.answer===0;if(i.answer===0)saved.wrong=saved.wrong.filter(x=>x!==i.id);else if(!saved.wrong.includes(i.id))saved.wrong.push(i.id)}
function result(){S.items.forEach(record);store();const bad=S.items.filter(i=>i.answer!==0),n=S.items.length,c=n-bad.length;root.innerHTML=`<section class="panel"><p class="eyebrow">학습 완료 · KẾT QUẢ</p><div class="score">${Math.round(c/n*100)}%</div><div class="stats"><div><b>${n}</b><small>Tổng câu</small></div><div><b>${c}</b><small>Đúng</small></div><div><b>${bad.length}</b><small>Sai</small></div></div>${bad.length?'<button class="btn" id="retry">Làm lại các câu sai trong lượt này</button>':''}<button class="btn alt" id="restart">Làm lại bộ câu này (xáo trộn)</button><button class="btn alt" id="back">Về trang chủ</button></section><section class="panel"><h3>Kết quả theo mục</h3>${Object.entries(topics).map(([k,v])=>{let a=S.items.filter(i=>Q[i.id].section===k);if(!a.length)return '';let b=a.filter(i=>i.answer===0).length;return `<div class="row"><span>${esc(v[0])}</span><b>${b}/${a.length}</b></div><div class="track"><div class="fill" style="width:${b/a.length*100}%"></div></div>`}).join('')}</section><section class="panel"><h3>Đáp án và giải thích</h3>${[...bad,...S.items.filter(i=>i.answer===0)].map(i=>{let q=Q[i.id];return `<details><summary class="${i.answer===0?'green':'red'}">${i.answer===0?'✓':'✕'} ${esc(q.q)}</summary>${feedback(q,i.answer)}</details>`}).join('')}</section>`;let r=document.getElementById('retry');if(r)r.onclick=()=>start(bad.map(i=>i.id),'study',0);document.getElementById('restart').onclick=()=>start(S.items.map(i=>i.id),S.mode,0);document.getElementById('back').onclick=home;}
document.getElementById('home').onclick=()=>{store();home();window.scrollTo(0,0)};S=saved.session;home();
</script></body></html>
